  <text x="60.0" y="530.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Curvas ilustrativas de comportamento — não representam dados de um produto específico.</text>
