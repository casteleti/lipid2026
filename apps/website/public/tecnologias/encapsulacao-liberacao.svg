<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t">
  <title id="t">Perfis de liberação de sistemas encapsulados</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eefb"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#fundo)"/>
  <text x="60.0" y="62.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#1e3f99" text-anchor="start">ENCAPSULAÇÃO — PERFIL DE LIBERAÇÃO</text>
  <text x="60.0" y="96.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#16205c" text-anchor="start">A estrutura escolhida define o tempo</text>
  <rect x="60" y="136" width="730" height="328" rx="20" fill="#ffffff" opacity="0.7"/>
  <path d="M 110 150 L 110 400 L 750 400" stroke="#cbd5e1" stroke-width="1.6" fill="none"/>
