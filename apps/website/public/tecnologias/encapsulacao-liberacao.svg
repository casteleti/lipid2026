  <text x="750.0" y="426.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">Tempo</text>
  <path d="M 110 400 C 170 185.0, 230 156, 750 153" stroke="#16205c" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M 110 400 C 300 315.0, 440 225.0, 750 185.0" stroke="#1e3f99" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M 110 400 L 310 400 C 430 375.0, 540 255.0, 750 225.0" stroke="#93aee0" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <rect x="110" y="440" width="26" height="5" rx="2.5" fill="#16205c"/>
  <text x="146.0" y="447.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#16205c" text-anchor="start">Liberação imediata</text>
  <rect x="292.79999999999995" y="440" width="26" height="5" rx="2.5" fill="#1e3f99"/>
  <text x="328.8" y="447.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#16205c" text-anchor="start">Liberação prolongada</text>
