  <path d="M 110 275.0 L 750 275.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5" opacity="0.7" fill="none"/>
  <path d="M 110 212.5 L 750 212.5" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5" opacity="0.7" fill="none"/>
