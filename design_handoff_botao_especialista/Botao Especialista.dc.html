<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; }
  a { color: #17306e; text-decoration: none; }
  a:hover { color: #2a4fa8; }
</style>
</helmet>
<div style="min-height: 100vh; background: #ffffff; font-family: 'Inter Tight', Helvetica, sans-serif; display: flex; flex-direction: column;">
  <div style="height: 76px; border-bottom: 1px solid #ececf0; display: flex; align-items: center; justify-content: space-between; padding: 0 40px;">
    <div style="font-size: 15px; letter-spacing: 0.14em; color: #9aa0ad; font-weight: 600;">MENU</div>
    <button type="button" onMouseEnter="{{ onEnter }}" onMouseLeave="{{ onLeave }}" style="position: relative; overflow: hidden; border: 0; cursor: pointer; padding: 15px 30px; border-radius: 999px; background: #0f1e46; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: 0.01em; transition: background 300ms ease, box-shadow 300ms ease, transform 300ms ease;" style-hover="background: #16306f; box-shadow: 0 8px 26px rgba(20, 45, 110, 0.32); transform: translateY(-1px);">
      <canvas ref="{{ canvasRef }}" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
      <span style="position: relative;">Fale com um especialista</span>
    </button>
  </div>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; color: #b8bcc6; font-size: 13px; font-family: ui-monospace, monospace;">passe o mouse no botão</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;particleColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8fb6ff&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#8fb6ff&quot;,&quot;#7fe3ff&quot;,&quot;#b9c7ff&quot;,&quot;#9df0d0&quot;]},&quot;particleCount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:26,&quot;min&quot;:10,&quot;max&quot;:60,&quot;step&quot;:2,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.canvasRef = React.createRef();
    this.hover = 0;
    this.target = 0;
    this.parts = [];
  }
  componentDidMount() {
    const c = this.canvasRef.current;
    if (!c) return;
    const ctx = c.getContext('2d');
    const count = this.props.particleCount ?? 26;
    const accent = this.props.particleColor ?? '#8fb6ff';
    let w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const resize = () => {
      const r = c.getBoundingClientRect();
      w = r.width; h = r.height;
      c.width = w * dpr; c.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!this.parts.length) seed();
    };
    const seed = () => {
      this.parts = Array.from({ length: count }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.28, vy: (Math.random() - 0.5) * 0.24,
        r: 0.7 + Math.random() * 1.5, p: Math.random() * Math.PI * 2
      }));
    };
    const hex = accent.replace('#', '');
    const rgb = [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16)).join(',');
    const tick = () => {
      this.hover += (this.target - this.hover) * 0.09;
      ctx.clearRect(0, 0, w, h);
      if (this.hover > 0.01 && w) {
        for (const p of this.parts) {
          p.x += p.vx; p.y += p.vy; p.p += 0.05;
          if (p.x < 0) p.x += w; if (p.x > w) p.x -= w;
          if (p.y < 0) p.y += h; if (p.y > h) p.y -= h;
        }
        for (let i = 0; i < this.parts.length; i++) {
          const a = this.parts[i];
          for (let j = i + 1; j < this.parts.length; j++) {
            const b = this.parts[j];
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            if (d < 46) {
              ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.3 * (1 - d / 46) * this.hover).toFixed(3) + ')';
              ctx.lineWidth = 0.7;
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            }
          }
        }
        for (const p of this.parts) {
          const tw = 0.55 + 0.45 * Math.sin(p.p);
          ctx.fillStyle = 'rgba(' + rgb + ',' + (0.85 * tw * this.hover).toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(' + rgb + ',' + (0.12 * tw * this.hover).toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.4, 0, Math.PI * 2); ctx.fill();
        }
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.ro = new ResizeObserver(resize);
    this.ro.observe(c);
    resize();
    tick();
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    if (this.ro) this.ro.disconnect();
  }
  renderVals() {
    return {
      canvasRef: this.canvasRef,
      onEnter: () => { this.target = 1; },
      onLeave: () => { this.target = 0; }
    };
  }
}

</script>
</body>
</html>
