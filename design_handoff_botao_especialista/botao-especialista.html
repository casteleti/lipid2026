<!doctype html>
<meta charset="utf-8" />
<title>Botão especialista — versão HTML/CSS/JS</title>
<style>
  .btn-especialista {
    position: relative; overflow: hidden; border: 0; cursor: pointer;
    padding: 15px 30px; border-radius: 999px;
    background: #0f1e46; color: #fff;
    font: 700 15px/1 "Inter Tight", Helvetica, Arial, sans-serif;
    letter-spacing: .01em;
    transition: background 300ms ease, box-shadow 300ms ease, transform 300ms ease;
  }
  .btn-especialista:hover, .btn-especialista:focus-visible {
    background: #16306f; box-shadow: 0 8px 26px rgba(20,45,110,.32); transform: translateY(-1px);
  }
  .btn-especialista canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .btn-especialista span { position: relative; }
</style>

<button class="btn-especialista" type="button">
  <canvas></canvas><span>Fale com um especialista</span>
</button>

<script>
// Ativa o efeito em todo .btn-especialista da página.
document.querySelectorAll('.btn-especialista').forEach(function (btn) {
  var c = btn.querySelector('canvas');
  var ctx = c.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var COLOR = '143,182,255', COUNT = 26;
  var w = 0, h = 0, parts = [], hover = 0, target = 0;

  function seed() {
    parts = [];
    for (var i = 0; i < COUNT; i++) parts.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .28, vy: (Math.random() - .5) * .24,
      r: .7 + Math.random() * 1.5, p: Math.random() * Math.PI * 2
    });
  }
  function resize() {
    var r = c.getBoundingClientRect();
    w = r.width; h = r.height;
    c.width = w * dpr; c.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!parts.length) seed();
  }
  function tick() {
    hover += (target - hover) * .09;
    ctx.clearRect(0, 0, w, h);
    if (hover > .01 && w) {
      parts.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.p += .05;
        if (p.x < 0) p.x += w; if (p.x > w) p.x -= w;
        if (p.y < 0) p.y += h; if (p.y > h) p.y -= h;
      });
      for (var i = 0; i < parts.length; i++) for (var j = i + 1; j < parts.length; j++) {
        var a = parts[i], b = parts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 46) {
          ctx.strokeStyle = 'rgba(' + COLOR + ',' + (.3 * (1 - d / 46) * hover).toFixed(3) + ')';
          ctx.lineWidth = .7;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      parts.forEach(function (p) {
        var tw = .55 + .45 * Math.sin(p.p);
        ctx.fillStyle = 'rgba(' + COLOR + ',' + (.85 * tw * hover).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(' + COLOR + ',' + (.12 * tw * hover).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.4, 0, Math.PI * 2); ctx.fill();
      });
    }
    requestAnimationFrame(tick);
  }
  btn.addEventListener('mouseenter', function () { target = 1; });
  btn.addEventListener('mouseleave', function () { target = 0; });
  new ResizeObserver(resize).observe(c);
  resize(); tick();
});
</script>
