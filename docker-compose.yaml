services:
  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.daksa.app.br
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - coolify

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      API_PORT: 3002
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: 24h
    expose:
      - "3002"
    networks:
      - coolify
    volumes:
      - api_uploads:/app/apps/api/uploads

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.daksa.app.br
      NODE_ENV: production
    expose:
      - "3001"
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  api_uploads:
